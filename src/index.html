<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Kalorientracker</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2E7D6B" />
    <!-- GitHub Pages liefert keine eigenen Response-Header (Security-Audit
         2026-09-23) — dieses Meta-CSP ist die einzig mögliche Absicherung
         auf diesem Hosting. connect-src erlaubt genau die zwei APIs, die
         die App tatsächlich anspricht (Supabase, Open Food Facts). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' https://*.supabase.co https://world.openfoodfacts.org; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; base-uri 'self'; object-src 'none'"
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Bitte aktiviere JavaScript, um diese Anwendung zu nutzen.</noscript>
  </body>
</html>
