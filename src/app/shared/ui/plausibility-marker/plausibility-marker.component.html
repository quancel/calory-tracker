@if (marker(); as m) {
  @if (interactive()) {
    <button
      type="button"
      class="marker-button"
      [class.marker-button-warning]="m.kind === 'implausible'"
      (click)="onClick()"
      [attr.aria-label]="statusText(m) + ariaLabelSuffix()"
    >
      @if (m.kind === 'implausible') {
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path
            d="M12 3.5 2.5 20h19L12 3.5Z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
          />
          <path d="M12 9.5v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          <circle cx="12" cy="17.2" r="0.9" fill="currentColor" stroke="none" />
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8" />
          <path
            d="M9.4 9.3a2.6 2.6 0 1 1 3.9 2.2c-.9.5-1.3 1-1.3 1.9"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
          <circle cx="12" cy="16.7" r="0.9" fill="currentColor" stroke="none" />
        </svg>
      }
    </button>
  } @else {
    <span
      class="marker-icon-inline"
      [class.marker-icon-inline-warning]="m.kind === 'implausible'"
      [attr.aria-label]="statusText(m)"
    >
      @if (m.kind === 'implausible') {
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path
            d="M12 3.5 2.5 20h19L12 3.5Z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
          />
          <path d="M12 9.5v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          <circle cx="12" cy="17.2" r="0.9" fill="currentColor" stroke="none" />
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8" />
          <path
            d="M9.4 9.3a2.6 2.6 0 1 1 3.9 2.2c-.9.5-1.3 1-1.3 1.9"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
          <circle cx="12" cy="16.7" r="0.9" fill="currentColor" stroke="none" />
        </svg>
      }
    </span>
  }
}
