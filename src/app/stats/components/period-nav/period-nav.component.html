<nav class="period-nav" aria-label="Perioden-Navigation">
  <button type="button" class="chevron" (click)="onPrevious()" aria-label="Vorherige Periode">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <path
        d="M15 5l-7 7 7 7"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>

  <span class="label tnum">{{ label() }}</span>

  <button
    type="button"
    class="chevron"
    [disabled]="!canGoForward()"
    [attr.aria-disabled]="!canGoForward() ? true : null"
    (click)="onNext()"
    aria-label="Nächste Periode"
  >
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <path
        d="M9 5l7 7-7 7"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>
</nav>
